services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: feed
      POSTGRES_PASSWORD: feed
      POSTGRES_DB: feed_novidades
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feed -d feed_novidades"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
