name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.12", "26"]
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: feed
          POSTGRES_PASSWORD: feed
          POSTGRES_DB: feed_novidades
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feed -d feed_novidades"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
